<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acervo de sons • Show Monopoly</title>
<style>
:root{color-scheme:dark;font:16px system-ui;color:#f5efdc;background:#091b16}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#27543f,transparent 60%);min-height:100vh}header,main{max-width:1200px;margin:auto;padding:32px 24px}header{padding-top:48px}a{color:#ebc876}h1{font-size:clamp(32px,5vw,60px);letter-spacing:-.045em;margin:20px 0 8px}p{color:#bccdc3}.eyebrow{font-size:12px;letter-spacing:.2em;color:#e6bd63;text-transform:uppercase}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select,button{font:inherit;border:1px solid #496052;border-radius:10px;background:#132e23;color:inherit;padding:13px}input[type=search]{flex:1;min-width:220px}button{cursor:pointer}button:hover{background:#2e523d}button:focus-visible,a:focus-visible{outline:3px solid #e8c674;outline-offset:3px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px;padding-bottom:110px}.card{padding:20px;background:#163026cc;border:1px solid #385144;border-radius:16px}.card.active{border-color:#ebc876;background:#294835}.card small{color:#b6c8bd}.card h2{font-size:17px;overflow-wrap:anywhere;min-height:44px;margin:12px 0}.card button{width:100%;background:#d8b969;color:#182b20;border:0;font-weight:700}.player{position:fixed;bottom:0;left:0;right:0;background:#10271ff2;border-top:1px solid #597051;padding:16px 24px;display:flex;gap:20px;align-items:center;backdrop-filter:blur(16px)}#now{flex:1;overflow-wrap:anywhere}#progress{width:100%;accent-color:#e6bd63}label{white-space:nowrap}#volume{width:95px;vertical-align:middle}#status{min-height:24px}@media(max-width:600px){.player{flex-wrap:wrap;gap:8px}#now{min-width:65%}header,main{padding:22px 16px}}
</style>
<header><div class="eyebrow">Show Monopoly • Estúdio de áudio</div><h1>Acervo de sons</h1><p>Ouça os efeitos, vozes e músicas extraídos. Um som de cada vez, no seu volume.</p><a href="./">← Voltar ao jogo</a><div class="toolbar"><input id="search" type="search" placeholder="Buscar: bola, prêmio, moeda…" aria-label="Buscar som"><select id="group" aria-label="Filtrar por jogo"><option value="">Todos os jogos</option></select></div><p id="status" role="status">Carregando acervo…</p></header>
<main><div id="grid"></div></main><footer class="player"><div id="now" aria-live="polite">Escolha um som para ouvir<progress id="progress" value="0" max="1"></progress></div><button id="stop">■ Parar</button><label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.7"></label></footer>
<audio id="audio" preload="metadata"></audio><script>
const $=id=>document.getElementById(id), audio=$('audio');audio.preload='metadata';audio.volume=.7;
let sounds=[],current=null,request=0,timer=null;
function stop(){request++;audio.pause();clearInterval(timer);current=null;$('progress').value=0;$('now').firstChild.textContent='Escolha um som para ouvir';document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));document.querySelectorAll('[data-play]').forEach(x=>x.textContent='▶ Ouvir');}
async function play(item,card,button){if(current===item){stop();return;}stop();current=item;const token=request;card.classList.add('active');button.textContent='■ Parar';$('now').firstChild.textContent=item.name+' · '+item.group;
try{audio.src=item.file;await new Promise((resolve,reject)=>{audio.onloadedmetadata=resolve;audio.onerror=()=>reject(Error('Arquivo indisponível'));audio.load();});if(token!==request)return;audio.currentTime=item.start;await audio.play();if(token!==request)return;timer=setInterval(()=>{if(audio.currentTime>=item.end){stop();return;}$('progress').value=Math.max(0,(audio.currentTime-item.start)/item.duration)},20);}catch(e){if(token===request){stop();$('status').textContent='Não foi possível tocar este som: '+e.message;}}}
function render(){const query=$('search').value.toLocaleLowerCase('pt-BR'),group=$('group').value;const filtered=sounds.filter(x=>(!group||x.group===group)&&(x.name+' '+x.group).toLocaleLowerCase('pt-BR').includes(query));$('grid').replaceChildren();$('status').textContent=filtered.length+' sons encontrados · '+sounds.length+' no acervo';for(const item of filtered){const card=document.createElement('article');card.className='card'+(current===item?' active':'');const small=document.createElement('small');small.textContent=item.group+' · '+item.duration.toFixed(2)+' s';const h=document.createElement('h2');h.textContent=item.name.replaceAll('_',' ');const button=document.createElement('button');button.dataset.play='';button.textContent=current===item?'■ Parar':'▶ Ouvir';button.setAttribute('aria-label','Ouvir '+item.name);button.onclick=()=>play(item,card,button);card.append(small,h,button);$('grid').append(card);}}
$('search').oninput=render;$('group').onchange=render;$('stop').onclick=stop;$('volume').oninput=e=>audio.volume=Number(e.target.value);audio.onended=stop;window.addEventListener('pagehide',stop);
fetch('sounds.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{sounds=data;for(const group of [...new Set(data.map(x=>x.group))].sort()){const option=document.createElement('option');option.value=option.textContent=group;$('group').append(option);}render()}).catch(()=>$('status').textContent='Não foi possível carregar o acervo. Atualize a página.');
</script></html>
